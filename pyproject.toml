[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracepatch"
version = "0.2.0"
description = "Budgeted verification of structured agent memories under incomplete provenance"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
plots = ["matplotlib>=3.8"]

[project.scripts]
tracepatch = "tracepatch.cli:main"

[tool.setuptools.packages.find]
include = ["tracepatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
